# Despliegue automático del backend a la VPS (EasyPanel) al hacer push a main.
#
# 1) Job "build": construye la imagen, la arranca contra un PostgreSQL temporal y
#    verifica GET /health/ready. Si el Dockerfile o el arranque se rompen, no se
#    dispara el deploy.
# 2) Job "deploy": dispara el webhook de la App de EasyPanel, que baja el commit
#    nuevo y reconstruye el contenedor en la VPS.
#
# Secret requerido (Settings > Secrets and variables > Actions):
#   EASYPANEL_DEPLOY_WEBHOOK -> URL del webhook de deploy de la App del backend
#   en EasyPanel (App > General/Deploy > "Deploy Webhook", es una URL con token).
#
# La imagen no se publica en un registry: EasyPanel construye desde el repo con
# el Dockerfile, igual que el despliegue manual documentado en DEPLOY.md.

name: Deploy a la VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un deploy a la vez: si llegan dos push seguidos, no se pisan.
concurrency:
  group: deploy-backend-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Verificar imagen y arranque
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: libreria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d libreria"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: parcial2-prog3-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Arrancar la API contra PostgreSQL y verificar /health/ready
        run: |
          set -euo pipefail
          docker run -d --name api-ci -p 8000:8000 \
            --add-host=host.docker.internal:host-gateway \
            -e DATABASE_URL='postgresql+asyncpg://postgres:postgres@host.docker.internal:5432/libreria' \
            -e SQL_ECHO=false \
            parcial2-prog3-api:ci

          listo=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/ready >/dev/null 2>&1; then
              echo "OK: /health/ready responde 200 (la API creó las tablas y llega a PostgreSQL)"
              curl -fsS http://localhost:8000/health/live
              listo=1
              break
            fi
            sleep 2
          done

          if [ "$listo" -ne 1 ]; then
            echo "::error::La API no quedó lista (revisar el log del contenedor)"
            docker logs api-ci || true
            exit 1
          fi

      - name: Limpiar contenedor de prueba
        if: always()
        run: docker rm -f api-ci || true

  deploy:
    name: Desplegar en EasyPanel
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Disparar webhook de EasyPanel
        env:
          WEBHOOK: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK:-}" ]; then
            echo "::error::Falta el secret EASYPANEL_DEPLOY_WEBHOOK (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/resp -w '%{http_code}' -X POST "$WEBHOOK") || code=000
            echo "Intento $i -> HTTP $code"
            cat /tmp/resp 2>/dev/null || true
            echo ""
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              echo "Deploy disparado en EasyPanel"
              exit 0
            fi
            sleep 10
          done
          echo "::error::EasyPanel rechazó el deploy (revisar el webhook y los logs de la app)"
          exit 1
